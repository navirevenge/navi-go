spring:
  profiles:
    default: local
  application:
    name: navigo-backend
  datasource:
    url: ${NAVIGO_DB_URL:jdbc:postgresql://localhost:5432/navigo}
    username: ${NAVIGO_DB_USER:navigo}
    password: ${NAVIGO_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: always
navigo:
  jwt:
    secret: ${NAVIGO_JWT_SECRET:}
    ttl: ${NAVIGO_JWT_TTL:12h}
  cors:
    allowed-origins: ${NAVIGO_CORS_ORIGINS:http://localhost:3000}
management:
  endpoints:
    web:
      exposure:
        include: health
