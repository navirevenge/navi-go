services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-navigo}
      POSTGRES_USER: ${POSTGRES_USER:-navigo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-navigo} -d ${POSTGRES_DB:-navigo}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      NAVIGO_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-navigo}
      NAVIGO_DB_USER: ${POSTGRES_USER:-navigo}
      NAVIGO_DB_PASSWORD: ${POSTGRES_PASSWORD}
      NAVIGO_JWT_SECRET: ${NAVIGO_JWT_SECRET:?set NAVIGO_JWT_SECRET in .env}
      NAVIGO_CORS_ORIGINS: ${NAVIGO_CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
